apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-web-page
  labels:
    app.kubernetes.io/name: devops-web
data:
  index.html: |
    <!doctype html>
    <html lang="es">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>DevOps | Kubernetes + Helm + Argo CD</title>
      <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #080f1f; color: #f1f5f9; display: grid; place-items: center; }
        main { width: min(720px, 92vw); padding: 50px; border: 1px solid #23344e; border-radius: 22px; background: linear-gradient(125deg, #102440, #101827); }
        .eyebrow { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: #34d399; font-weight: 700; }
        h1 { font-size: clamp(28px, 6vw, 48px); line-height: 1.12; margin: 22px 0; }
        p { font-size: 17px; color: #a9bfd4; line-height: 1.65; }
        .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
        .pills span { border: 1px solid #235d69; border-radius: 40px; padding: 8px 14px; font-size: 13px; background: #112e3c; color: #c2fff0; }
      </style>
    </head>
    <body>
      <main>
        <div class="eyebrow">✓ Despliegue operativo · GitOps</div>
        <h1>De GitHub a Kubernetes, automáticamente.</h1>
        <p>Aplicación Nginx desplegada con un Helm Chart y administrada por Argo CD. Los cambios publicados en Git determinan el estado deseado del clúster.</p>
        <div class="pills"><span>Kubernetes</span><span>Helm Chart</span><span>Argo CD</span><span>GitOps</span></div>
      </main>
    </body>
    </html>
